name: GitHub Metrics

on:
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metrics.yml'
      - 'scripts/publish-metrics.py'

permissions: {}

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Check optional personal token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
        run: echo "available=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Render official Metrics (personal token)
        if: steps.token.outputs.available == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shengruduzhou
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tokyo
          config_display: columns
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugins_errors_fatal: yes
          output_action: none
          filename: github-metrics.svg

      # This is a best-effort limited public-data mode. Upstream recommends a PAT.
      - name: Try official Metrics with restricted repository token
        if: steps.token.outputs.available != 'true'
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ github.token }}
          user: shengruduzhou
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tokyo
          config_display: columns
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugins_errors_fatal: yes
          output_action: none
          filename: github-metrics.svg

      - name: Collect render or public instance
        id: collect
        env:
          PUBLIC_METRICS_URL: 'https://metrics.lecoq.io/shengruduzhou?template=classic&base=header%2Cactivity%2Ccommunity%2Crepositories&isocalendar=1&isocalendar.duration=half-year&languages=1&languages.limit=6&config.timezone=Asia%2FTokyo'
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/github-metrics.svg"
          if [ -s /metrics_renders/github-metrics.svg ]; then
            cp /metrics_renders/github-metrics.svg "$candidate"
          fi
          if [ ! -s "$candidate" ]; then
            if ! curl --fail --silent --show-error --location --max-time 60 "$PUBLIC_METRICS_URL" -o "$candidate"; then
              rm -f "$candidate"
            fi
          fi
          if [ -s "$candidate" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Metrics render. Add METRICS_TOKEN to repository Actions secrets."
          fi

      - name: Store render for validation
        if: steps.collect.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: profile-metrics-svg
          path: ${{ runner.temp }}/github-metrics.svg
          if-no-files-found: error
          retention-days: 1
    outputs:
      available: ${{ steps.collect.outputs.available }}

  publish:
    needs: render
    if: needs.render.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: profile-metrics-svg
          path: ${{ runner.temp }}/metrics
      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python scripts/publish-metrics.py "$RUNNER_TEMP/metrics/github-metrics.svg"
          git add README.md
          if [ -f assets/metrics/github-metrics.svg ]; then
            git add assets/metrics/github-metrics.svg
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh GitHub metrics"
          git push origin HEAD:main
