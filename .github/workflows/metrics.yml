name: GitHub Metrics

on:
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metrics.yml'
      - 'scripts/publish-metrics.py'

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Check optional token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
        run: echo "available=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Render official Metrics infographic
        id: render
        if: steps.token.outputs.available == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shengruduzhou
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Tokyo
          config_display: columns
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugins_errors_fatal: yes
          output_action: none
          filename: github-metrics.svg

      - name: Collect official render or public instance
        env:
          PUBLIC_METRICS_URL: 'https://metrics.lecoq.io/shengruduzhou?template=classic&base=header%2Cactivity%2Ccommunity%2Crepositories&isocalendar=1&isocalendar.duration=half-year&languages=1&languages.limit=6&config.timezone=Asia%2FTokyo'
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/github-metrics.svg"
          if [ -s /metrics_renders/github-metrics.svg ]; then
            cp /metrics_renders/github-metrics.svg "$candidate"
          else
            if ! curl --fail --silent --show-error --location --retry 2 --max-time 90 "$PUBLIC_METRICS_URL" -o "$candidate"; then
              rm -f "$candidate"
              echo "::warning::Public Metrics endpoint unavailable; preserving last good render."
            fi
          fi
          if [ -s "$candidate" ]; then
            # Refresh the checkout first so other profile workflows are not overwritten.
            git pull --ff-only origin main
            python scripts/publish-metrics.py "$candidate"
          fi

      - name: Publish validated infographic
        shell: bash
        run: |
          set -euo pipefail
          git add README.md
          if [ -f assets/metrics/github-metrics.svg ]; then
            git add assets/metrics/github-metrics.svg
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh GitHub metrics"
          git push origin HEAD:main
