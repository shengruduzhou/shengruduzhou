name: Profile detail metrics

on:
  schedule:
    - cron: '45 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/metrics-details.yml'
      - 'scripts/publish-metrics-details.py'

permissions: {}

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      HAS_WAKA: ${{ secrets.WAKATIME_OAUTH_TOKEN != '' }}
      HAS_STOCK: ${{ secrets.STOCK_TOKEN != '' }}
      HAS_MUSIC: ${{ secrets.SPOTIFY_TOKENS != '' }}
      HAS_STEAM: ${{ secrets.STEAM_TOKEN != '' }}
      STEAM_USER: ${{ vars.STEAM_USER }}
      ANILIST_USER: ${{ vars.ANILIST_USER }}
      STOCK_SYMBOL: ${{ vars.STOCK_SYMBOL }}
    strategy:
      fail-fast: false
      matrix:
        module: [calendar, languages, trophy-dark, trophy-light, wakatime, anilist, music, steam, stock]
    steps:
      - name: Render full-year isometric calendar
        if: matrix.module == 'calendar'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ github.token }}
          user: shengruduzhou
          template: classic
          base: metadata
          config_timezone: Asia/Tokyo
          config_display: large
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: yes
          output_action: none
          filename: isocalendar.svg

      - name: Render in-depth languages
        if: matrix.module == 'languages'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ github.token }}
          user: shengruduzhou
          template: classic
          base: metadata
          config_timezone: Asia/Tokyo
          config_display: columns
          config_animations: no
          commits_authoring: .user.login, shengruduzhou, 渡, Shan Hefu, 167118127+shengruduzhou@users.noreply.github.com
          plugin_languages: yes
          plugin_languages_indepth: yes
          # v3.34 recent analyzer fails on missing commit records; retain patch-based history.
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_languages_categories: programming
          plugin_languages_limit: 8
          plugin_languages_skipped: shengruduzhou/shengruduzhou
          plugin_languages_analysis_timeout: 12
          plugin_languages_analysis_timeout_repositories: 3
          plugins_errors_fatal: yes
          output_action: none
          filename: languages.svg

      - name: Generate official trophy locally
        if: startsWith(matrix.module, 'trophy-')
        uses: ryo-ma/github-profile-trophy@43736b50a82fca73c8df1c81abb40aa03519975c
        with:
          username: shengruduzhou
          token: ${{ github.token }}
          output_path: ${{ runner.temp }}/${{ matrix.module }}.svg
          theme: ${{ matrix.module == 'trophy-dark' && 'tokyonight' || 'flat' }}

      - name: Explain missing WakaTime OAuth token
        if: matrix.module == 'wakatime' && env.HAS_WAKA != 'true'
        run: echo "::notice::WakaTime requires a personal OAuth token. Add WAKATIME_OAUTH_TOKEN from https://wakatime.com/oauth to repository Actions secrets."

      - name: Render WakaTime dashboard
        if: matrix.module == 'wakatime' && env.HAS_WAKA == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: NOT_NEEDED
          base: ""
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
          plugin_wakatime_sections: time, languages, languages-graphs, editors, editors-graphs, os
          plugin_wakatime_days: 7
          plugin_wakatime_limit: 6
          plugin_wakatime_repositories_visibility: public
          config_timezone: Asia/Tokyo
          config_animations: no
          plugins_errors_fatal: yes
          output_action: none
          filename: wakatime.svg

      - name: Explain missing anilist configuration
        if: matrix.module == 'anilist' && env.ANILIST_USER == ''
        run: echo "::notice::Set ANILIST_USER to your public AniList username in repository Actions variables."

      - name: Render AniList media activity
        if: matrix.module == 'anilist' && env.ANILIST_USER != ''
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: NOT_NEEDED
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: ${{ vars.ANILIST_USER }}
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, watching, reading
          plugin_anilist_limit: 2
          plugin_anilist_shuffle: no
          config_timezone: Asia/Tokyo
          config_animations: no
          plugins_errors_fatal: yes
          output_action: none
          filename: anilist.svg

      - name: Explain missing music configuration
        if: matrix.module == 'music' && env.HAS_MUSIC != 'true'
        run: echo "::notice::Set SPOTIFY_TOKENS in repository Actions secrets (client_id, client_secret, refresh_token)."

      - name: Render Spotify listening activity
        if: matrix.module == 'music' && env.HAS_MUSIC == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: NOT_NEEDED
          base: ""
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: recent
          plugin_music_token: ${{ secrets.SPOTIFY_TOKENS }}
          plugin_music_limit: 4
          config_timezone: Asia/Tokyo
          config_animations: no
          plugins_errors_fatal: yes
          output_action: none
          filename: music.svg

      - name: Explain missing steam configuration
        if: matrix.module == 'steam' && (env.HAS_STEAM != 'true' || env.STEAM_USER == '')
        run: echo "::notice::Set STEAM_TOKEN in Actions secrets and STEAM_USER (SteamID64) in Actions variables."

      - name: Render Steam gaming activity
        if: matrix.module == 'steam' && env.HAS_STEAM == 'true' && env.STEAM_USER != ''
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: NOT_NEEDED
          base: ""
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: ${{ vars.STEAM_USER }}
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_games_limit: 3
          plugin_steam_recent_games_limit: 3
          plugin_steam_achievements_limit: 2
          config_timezone: Asia/Tokyo
          config_animations: no
          plugins_errors_fatal: yes
          output_action: none
          filename: steam.svg

      - name: Explain missing stock configuration
        if: matrix.module == 'stock' && (env.HAS_STOCK != 'true' || env.STOCK_SYMBOL == '')
        run: echo "::notice::Set STOCK_TOKEN (RapidAPI Yahoo Finance) in Actions secrets and STOCK_SYMBOL in Actions variables."

      - name: Render public stock watch chart
        if: matrix.module == 'stock' && env.HAS_STOCK == 'true' && env.STOCK_SYMBOL != ''
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: NOT_NEEDED
          base: ""
          config_display: large
          plugin_stock: yes
          plugin_stock_token: ${{ secrets.STOCK_TOKEN }}
          plugin_stock_symbol: ${{ vars.STOCK_SYMBOL }}
          plugin_stock_duration: 3mo
          plugin_stock_interval: 1d
          config_timezone: Asia/Tokyo
          config_animations: no
          plugins_errors_fatal: yes
          output_action: none
          filename: stock.svg

      - name: Collect module
        id: collect
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/profile-module"
          case "$MODULE" in
            calendar) cp /metrics_renders/isocalendar.svg "$RUNNER_TEMP/profile-module/isocalendar.svg" ;;
            languages) cp /metrics_renders/languages.svg "$RUNNER_TEMP/profile-module/languages.svg" ;;
            trophy-dark|trophy-light) cp "$RUNNER_TEMP/$MODULE.svg" "$RUNNER_TEMP/profile-module/$MODULE.svg" ;;
            wakatime|anilist|music|steam|stock)
              if [ -s "/metrics_renders/$MODULE.svg" ]; then
                cp "/metrics_renders/$MODULE.svg" "$RUNNER_TEMP/profile-module/$MODULE.svg"
              else
                echo "::notice::$MODULE has no render; optional credentials or configuration may be missing."
                echo "available=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *) exit 1 ;;
          esac
          echo 'available=true' >> "$GITHUB_OUTPUT"

      - name: Upload module
        if: steps.collect.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: profile-detail-${{ matrix.module }}
          path: ${{ runner.temp }}/profile-module/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: profile-detail-*
          path: ${{ runner.temp }}/profile-details
          merge-multiple: true
      - name: Validate and publish successful modules
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python scripts/publish-metrics-details.py "$RUNNER_TEMP/profile-details"
          git add README.md assets/metrics
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish profile detail metrics"
          git push origin HEAD:main
